version: '3.8'

services:
  # Bancos locais separados por ambiente lógico
  postgres:
    image: postgres:16-alpine
    container_name: pagamentus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario_fake
      POSTGRES_PASSWORD: senha_fake
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario_fake -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicação Módulo Item 4 (SPEC-4.1 - Folha de Pagamento)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagamentus_item4_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://usuario_fake:senha_fake@postgres:5432/pagamentus_prod
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
